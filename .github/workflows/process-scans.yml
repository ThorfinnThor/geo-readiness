name: Process scans

# Optional/backup worker (ADR-0003): drain the Postgres scan queue via Actions.
# The primary worker is the always-on Railway container; this workflow stays as a
# free fallback / manual drainer. It runs ONLY when explicitly triggered — the
# web app's repository_dispatch (if GITHUB_DISPATCH_TOKEN is set) or a manual run
# — so it never fails on a schedule when the DB secret isn't configured.
# To use Actions as the *primary* worker instead, re-add a `schedule:` cron here
# and set the DATABASE_URL_ASYNC repo secret (see docs/deploy.md).
on:
  repository_dispatch:
    types: [scan-enqueued]
  workflow_dispatch: {}

# Single-flight: overlapping submissions coalesce into one draining run + one
# queued run, so a burst never spawns a pile of runners. Never cancel a run
# mid-scan — let it finish draining.
concurrency:
  group: process-scans
  cancel-in-progress: false

jobs:
  drain:
    name: Drain scan queue
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/worker/uv.lock
      - name: Sync (no dev)
        run: uv sync --frozen --no-dev
      - name: Migrate to head
        run: uv run alembic upgrade head
      - name: Recover stranded jobs + drain the queue
        run: uv run python scripts/process_jobs.py
    env:
      # Supabase session pooler (5432) — set in repo Settings → Secrets → Actions.
      DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
      METHODOLOGY_VERSION: geo-readiness-v2
      LOG_LEVEL: info
