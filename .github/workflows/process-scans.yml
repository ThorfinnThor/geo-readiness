name: Process scans

# The scan worker (ADR-0003): drain the Postgres scan queue on GitHub Actions.
# Fast path: the web app fires a repository_dispatch the moment a scan is
# enqueued. Backstop: a schedule catches any missed dispatch and reclaims jobs
# stranded by a cancelled run (lease recovery). Also runnable manually.
# Requires the DATABASE_URL_ASYNC repo secret (see docs/deploy.md).
on:
  repository_dispatch:
    types: [scan-enqueued]
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

# Single-flight: overlapping submissions coalesce into one draining run + one
# queued run, so a burst never spawns a pile of runners. Never cancel a run
# mid-scan — let it finish draining.
concurrency:
  group: process-scans
  cancel-in-progress: false

jobs:
  drain:
    name: Drain scan queue
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      # Before the DB secret is configured (e.g. scheduled runs pre-deploy),
      # no-op cleanly instead of failing red.
      - name: Note if worker DB not configured
        if: ${{ env.DATABASE_URL_ASYNC == '' }}
        run: echo "DATABASE_URL_ASYNC not set — worker not configured yet; skipping drain."
      - name: Install uv
        if: ${{ env.DATABASE_URL_ASYNC != '' }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/worker/uv.lock
      - name: Sync (no dev)
        if: ${{ env.DATABASE_URL_ASYNC != '' }}
        run: uv sync --frozen --no-dev
      - name: Migrate to head
        if: ${{ env.DATABASE_URL_ASYNC != '' }}
        run: uv run alembic upgrade head
      - name: Recover stranded jobs + drain the queue
        if: ${{ env.DATABASE_URL_ASYNC != '' }}
        run: uv run python scripts/process_jobs.py
    env:
      # Supabase session pooler (5432) — set in repo Settings → Secrets → Actions.
      DATABASE_URL_ASYNC: ${{ secrets.DATABASE_URL_ASYNC }}
      METHODOLOGY_VERSION: geo-readiness-v2
      LOG_LEVEL: info
