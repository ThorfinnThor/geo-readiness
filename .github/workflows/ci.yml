name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No real external website crawl runs in CI (plan §46).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  worker:
    name: Worker (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: geo
          POSTGRES_PASSWORD: geo
          POSTGRES_DB: geo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geo -d geo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_ASYNC: postgresql+asyncpg://geo:geo@localhost:5432/geo
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync
        run: uv sync --all-extras --dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q

  integration:
    name: Integration (web ↔ Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: geo
          POSTGRES_PASSWORD: geo
          POSTGRES_DB: geo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geo -d geo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://geo:geo@localhost:5432/geo
      DATABASE_URL_ASYNC: postgresql+asyncpg://geo:geo@localhost:5432/geo
    steps:
      - uses: actions/checkout@v4
      # Apply the schema from the Python-owned Alembic migrations.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Migrate to head
        working-directory: apps/worker
        run: |
          uv sync --dev
          uv run alembic upgrade head
      # Run the DB-backed web tests.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Integration tests
        run: pnpm --filter @geo/web test:integration
